[project]
name = "enterprise-customer-service-agent"
version = "0.1.0"
description = "基于 LangGraph + RAG 的企业客服 Agent 系统（企业级增强版）"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM"]
ignore = ["E501", "B008", "B904", "UP042", "SIM102", "SIM105", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# 第三方库没有 py.typed / 类型存根：显式声明忽略，而不是把 mypy 从 CI 里拿掉。
[[tool.mypy.overrides]]
module = [
    "jose",
    "jose.*",
    "python_json_logger",
    "chromadb",
    "chromadb.*",
    "langchain_mcp_adapters",
    "langchain_mcp_adapters.*",
]
ignore_missing_imports = true
