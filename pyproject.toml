[project]
name = "enterprise-customer-service-agent"
version = "7.0.0"
description = "基于 LangGraph + RAG 的企业客服 Agent 系统（企业级增强版）"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM"]
ignore = ["E501", "B008", "B904", "UP042", "SIM105", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "auth", "config", "db", "llm", "main", "metrics", "rag", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
